# Merge these patch entries into rime_ice.custom.yaml.
# This profile assumes the fork's English-learning capitalization filter is
# already installed in Rime Ice's third filter slot. No new Lua is required.
patch:
  # Leave the first dot to the pager; Rime restores it before a following lowercase letter.
  # Hyphenated input is recognized immediately.
  recognizer/patterns/url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[A-Za-z][A-Za-z0-9]*-.*$|^[A-Za-z][A-Za-z0-9-]*[.].+$"
  # Keep standalone repeated dots literal instead of cycling punctuation.
  recognizer/patterns/repeated_period: "^[.]{2,}$"
  # Echo must precede normal translators so real punctuation wins immediately.
  engine/translators/@before 0: echo_translator
  # Preserve literal URL/email case while retaining capitalization for words.
  engine/filters/@2: lua_filter@*learning_autocap_filter@english_case
  english_case/tags: [abc, alphanumeric_terms]
  # A list offers punctuation for selection instead of automatically committing.
  punctuator/half_shape/.: ["。"]
  punctuator/full_shape/.: ["。"]
  key_binder/bindings/+:
    - {when: paging, accept: comma, send: Page_Up}
    - {when: has_menu, accept: period, send: Page_Down}
    - {when: has_menu, accept: Control+a, send: Page_Up}
    - {when: has_menu, accept: Control+b, send: Page_Down}
