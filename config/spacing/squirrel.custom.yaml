# Merge these keys into your existing patch; this file is an opt-in example.
patch:
  spacing_context/enabled: true
  spacing_context/mode: adaptive
  # Ghostty reports terminal selections, not a stable insertion position.
  spacing_context/apps/com.mitchellh.ghostty/mode: events_only
  status_icon/show: false
  # Adaptive mode verifies readable context and falls back to event continuity.
  # Optional per-app override:
  # spacing_context/apps/com.example.App/mode: off
  # events_only skips document reads; external edits may be missed.
