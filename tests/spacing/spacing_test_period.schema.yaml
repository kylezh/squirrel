schema:
  schema_id: spacing_test_period
  name: spacing test
  version: '1'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - lua_processor@*mixed_spacing
    - lua_processor@*direct_commit
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - punct_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
translator:
  dictionary: spacing_test
  enable_user_dict: true
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
menu:
  page_size: 7
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code

key_binder:
  bindings:
    - {when: has_menu, accept: period, send: Page_Down}
punctuator:
  digit_separators: ",.:"
  digit_separator_action: commit
  half_shape:
    ".": {commit: "。"}
  full_shape:
    ".": {commit: "。"}
